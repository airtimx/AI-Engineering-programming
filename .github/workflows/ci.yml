name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate-windows:
    name: validate + pester (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Pester 5.5+
        shell: pwsh
        run: |
          ./scripts/bootstrap-pester.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: validate-workspace
        shell: pwsh
        run: |
          ./skills/validate-workspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests — Invoke-Pester tests/
        shell: pwsh
        run: |
          # Explicit gate: real Pester suite under tests/ (not smoke-only)
          # Prefer skills/run-tests.ps1 (pins Pester 5.x, exit-code contract)
          ./scripts/bootstrap-pester.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./skills/run-tests.ps1 -SkipInstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          ./skills/analyze-workspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trae skill hash sync (install -IDE Trae vs repo)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./skills/workspace-config.ps1
          $rule = Join-Path $PWD ".trae/rules/aiworkspace-p0.mdc"
          if (-not (Test-Path -LiteralPath $rule)) { throw "Missing $rule" }
          $dest = Join-Path $env:RUNNER_TEMP ("trae-skill-" + [guid]::NewGuid().ToString("N") + "/aiworkspace-manager")
          ./skills/install-global-skill.ps1 -IDE Trae -SkillRoot $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tk = Join-Path $dest "toolkit"
          $names = @(
            "workspace-config.ps1", "init-workspace.ps1", "auto-requirement.ps1",
            "new-module-spec.ps1", "new-bugfix.ps1", "resume-workspace.ps1",
            "validate-workspace.ps1", "aiws.ps1", "doctor-workspace.ps1", "claim-module.ps1",
            "install-global-skill.ps1", "uninstall-global-skill.ps1",
            "run-tests.ps1", "analyze-workspace.ps1", "VERSION"
          )
          foreach ($n in $names) {
            $a = Join-Path "skills" $n
            $b = Join-Path $tk $n
            if (-not (Test-Path -LiteralPath $a)) { throw "Missing repo file $a" }
            if (-not (Test-Path -LiteralPath $b)) { throw "Missing Trae toolkit file $b" }
            $ha = (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash
            $hb = (Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash
            if ($ha -ne $hb) { throw "Trae hash mismatch: $n`n  repo=$ha`n  trae=$hb" }
          }
          $skill = Get-Content -LiteralPath (Join-Path $dest "SKILL.md") -Raw
          if ($skill -notmatch '(?i)trae-cn') { throw "Trae SKILL.md missing .trae-cn path" }
          Write-Host "Trae skill directory hashes match repository skills/"
          ./skills/uninstall-global-skill.ps1 -IDE Trae -Force -SkillRoot $dest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  validate-ubuntu-pwsh:
    name: validate + pester (ubuntu pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Pester 5.5+
        shell: pwsh
        run: |
          ./scripts/bootstrap-pester.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: validate-workspace on PowerShell 7
        shell: pwsh
        run: |
          ./skills/validate-workspace.ps1 -SkipWriteTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests — Invoke-Pester tests/
        shell: pwsh
        run: |
          ./scripts/bootstrap-pester.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./skills/run-tests.ps1 -SkipInstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: path helpers + preferred bundle name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./skills/workspace-config.ps1
          $h = Get-AIWorkspaceHomeDirectory
          if ([string]::IsNullOrWhiteSpace($h)) { throw "home empty" }
          $pref = Get-AIWorkspacePreferredBundleDirName
          if ($pref -ne "workspace") { throw "expected preferred workspace, got $pref" }
          $trae = Get-AIWorkspaceGlobalSkillPath -IDE Trae
          if ($trae -notmatch '[\\/]\.trae-cn[\\/]skills[\\/]') { throw "trae path shape: $trae" }
          Write-Host "Linux/macOS path helpers OK (pwsh)"
