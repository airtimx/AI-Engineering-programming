name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate-windows:
    name: validate + pester (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate-workspace
        shell: pwsh
        run: |
          ./skills/validate-workspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Pester unit tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = "./tests"
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $cfg

  validate-ubuntu-pwsh:
    name: validate (ubuntu pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate-workspace on PowerShell 7
        shell: pwsh
        run: |
          # Path-safety tests that reference C:\Windows still throw on Linux (string check)
          ./skills/validate-workspace.ps1 -SkipWriteTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
