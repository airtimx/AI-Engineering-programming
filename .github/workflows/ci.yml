name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate-windows:
    name: validate + pester (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate-workspace
        shell: pwsh
        run: |
          ./skills/validate-workspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pester unit tests (via run-tests.ps1)
        shell: pwsh
        run: |
          ./skills/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          ./skills/analyze-workspace.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  validate-ubuntu-pwsh:
    name: validate (ubuntu pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate-workspace on PowerShell 7
        shell: pwsh
        run: |
          # Path-safety tests that reference C:\Windows still throw on Linux (string check)
          ./skills/validate-workspace.ps1 -SkipWriteTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
