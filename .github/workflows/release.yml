name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and verify release
        shell: powershell
        run: ./scripts/build-release.ps1 -ExpectedVersion "${{ github.ref_name }}"
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName "$($zip.FullName).sha256" --generate-notes --verify-tag
